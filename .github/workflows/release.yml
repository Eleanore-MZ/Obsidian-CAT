# Publishes a GitHub release (used by BRAT) whenever a version tag is pushed.
# Tag must equal the version in manifest.json, e.g. 0.0.1.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm test
      - name: Build
        run: npm run build
        env:
          CAT_PLUGIN_DIR: ${{ runner.temp }}/plugin-out
      - name: Check tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match manifest version $v"; exit 1; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
