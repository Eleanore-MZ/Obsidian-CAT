# Publishes a GitHub release (used by BRAT) for the version in manifest.json.
# Runs whenever manifest.json changes on main (i.e. after a version bump), or
# by hand from the Actions tab. If a release for that version already exists,
# nothing happens.
name: Release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "v=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.v }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.v }} already exists"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.skip == 'false'
        with:
          node-version: 20
      - if: steps.exists.outputs.skip == 'false'
        run: npm ci
      - if: steps.exists.outputs.skip == 'false'
        run: npm test
      - name: Build
        if: steps.exists.outputs.skip == 'false'
        run: npm run build
        env:
          CAT_PLUGIN_DIR: ${{ runner.temp }}/plugin-out
      - name: Create release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.v }}" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.v }}" \
            --notes-file RELEASE_NOTES.md
